services:
  # FastAPI Backend Web Service (100% Free Tier)
  - type: web
    name: local-skill-exchange-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # TiDB Cloud Serverless MySQL connection string configured in Render Dashboard
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: INIT_SEEDS
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
