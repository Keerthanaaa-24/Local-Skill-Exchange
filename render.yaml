services:
  # FastAPI Backend Web Service
  - type: web
    name: local-skill-exchange-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: local-skill-exchange-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: INIT_SEEDS
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  # Managed MySQL Database
  - name: local-skill-exchange-db
    databaseName: local_skill_exchange
    user: skill_user
    plan: starter
